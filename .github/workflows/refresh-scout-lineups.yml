name: Refresh Scout predicted line-ups

# Scout updates team news through the day, so this refreshes the Dataverse snapshot the
# app reads at runtime. The scraper validates hard (20 teams / 220 starters) and writes
# nothing if the page layout changes, so a failed run leaves the last good data in place.
on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sign in to Azure
        # Built from 4 separate secrets rather than one AZURE_CREDENTIALS JSON blob -
        # a single mis-pasted secret value silently breaks the whole JSON and produces
        # an opaque "client-id and tenant-id not supplied" error with no way to see why.
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Refresh Dataverse snapshot
        run: node scripts/refresh-scout-predicted-lineups.mjs --dataverse

      - name: Refresh bundled fallback
        run: node scripts/refresh-scout-predicted-lineups.mjs --file

      - name: Commit fallback if it changed
        run: |
          if [ -n "$(git status --porcelain app/src/lib/scoutPredictedLineups.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/src/lib/scoutPredictedLineups.ts
            git commit -m "chore: refresh Scout predicted line-ups fallback"
            git push
          fi

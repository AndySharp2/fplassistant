name: Refresh Scout predicted line-ups

# Scout updates team news through the day, so this refreshes the Dataverse snapshot the
# app reads at runtime. The scraper validates hard (20 teams / 220 starters) and writes
# nothing if the page layout changes, so a failed run leaves the last good data in place.
#
# Auth: the script gets a Dataverse token directly from Entra ID via the service
# principal's client-credentials flow (AZURE_CLIENT_ID / AZURE_CLIENT_SECRET /
# AZURE_TENANT_ID secrets). This needs only a free Entra ID app registration added as an
# Application User in the Dataverse environment - no Azure subscription required, so we
# don't use the `azure/login` action (it also tries to select a subscription, which fails
# with no-subscription accounts).
on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh Dataverse snapshot
        run: node scripts/refresh-scout-predicted-lineups.mjs --dataverse
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Refresh bundled fallback
        run: node scripts/refresh-scout-predicted-lineups.mjs --file

      - name: Commit fallback if it changed
        run: |
          if [ -n "$(git status --porcelain app/src/lib/scoutPredictedLineups.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/src/lib/scoutPredictedLineups.ts
            git commit -m "chore: refresh Scout predicted line-ups fallback"
            git push
          fi
